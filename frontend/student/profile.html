<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Library LMS</title><link rel="stylesheet" href="/frontend/css/style.css"></head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="logo">LMS</div><div><div class="brand-name">Library LMS</div><div class="brand-sub">Student Portal</div></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div><a class="nav-item" href="/frontend/student/dashboard.html">Dashboard</a><a class="nav-item" href="/frontend/student/books.html">Browse Books</a><a class="nav-item" href="/frontend/student/my-books.html">My Books</a>
      <div class="nav-section">Services</div><a class="nav-item" href="/frontend/student/membership.html">Membership Card</a><a class="nav-item" href="/frontend/student/events.html">Events</a>
      <a class="nav-item" href="/frontend/student/notifications.html">Notifications <span class="notif-badge" id="notif-badge" style="display:none">0</span></a>
      <a class="nav-item" href="/frontend/student/feedback.html">Feedback Corner</a>
      <div class="nav-section">Account</div><a class="nav-item active" href="/frontend/student/profile.html">Profile</a>
    </nav>
    <div class="sidebar-footer"><div class="nav-item" onclick="logout()">Logout</div></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="topbar-left"><span class="topbar-title">My Profile</span></div></header>
    <main class="content">
      <div style="max-width:520px;display:grid;gap:20px">
        <div class="card">
          <div class="card-header">Profile Information</div>
          <div class="card-body">
            <div style="text-align:center;margin-bottom:20px">
              <div style="width:64px;height:64px;background:#ede9fe;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:24px;font-weight:700;color:#4f46e5" id="avatar-circle"></div>
              <div style="font-weight:700" id="p-name-display"></div>
              <div style="font-size:12px;color:#64748b" id="p-id-display"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Full Name</label><input type="text" id="f-name"></div>
              <div class="form-group"><label>Phone</label><input type="text" id="f-phone"></div>
            </div>
            <div class="form-group"><label>Email</label><input type="email" id="f-email" disabled style="background:#f8fafc"></div>
            <div class="form-group"><label>Address</label><textarea id="f-address" rows="2"></textarea></div>
            <button class="btn btn-primary" onclick="updateProfile()">Update Profile</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/frontend/js/script.js"></script>
<script>
  if (!requireAuth('student')) throw '';
  async function load() {
    const r = await apiFetch('/auth/profile');
    if (!r?.ok) return;
    const d = r.data;
    document.getElementById('f-name').value    = d.name||'';
    document.getElementById('f-phone').value   = d.phone||'';
    document.getElementById('f-email').value   = d.email||'';
    document.getElementById('f-address').value = d.address||'';
    document.getElementById('p-name-display').textContent = d.name||'';
    document.getElementById('p-id-display').textContent   = d.member_id||'';
    document.getElementById('avatar-circle').textContent  = (d.name||'?')[0].toUpperCase();
  }
  async function updateProfile() {
    const r = await apiFetch('/auth/profile', { method:'PUT', body:JSON.stringify({
      name:document.getElementById('f-name').value,
      phone:document.getElementById('f-phone').value,
      address:document.getElementById('f-address').value
    })});
    if (r?.ok) { showToast('Profile updated!','success'); load(); }
    else showToast('Error updating','error');
  }
  load();
</script>
</body>
</html>
