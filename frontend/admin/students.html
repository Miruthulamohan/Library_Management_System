<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students — Admin LMS</title><link rel="stylesheet" href="/Library_Management_System/frontend/css/style.css"></head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="logo">LMS</div><div><div class="brand-name">Library LMS</div><div class="brand-sub">Admin Panel</div></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/dashboard.html">Dashboard</a>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/books.html">Books</a>
      <div class="nav-section">Issue / Return</div>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/issue.html">Issue Book</a>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/return.html">Return Book</a>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/overdue.html">Overdue</a>
      <div class="nav-section">Students</div>
      <a class="nav-item active" href="/Library_Management_System/frontend/admin/students.html">Students</a>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/who-is-in.html">Who Is In</a>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/feedback.html">Feedback Corner <span class="notif-badge" id="fb-badge" style="display:none">0</span></a>
      <div class="nav-section">Membership</div>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/members.html">Members</a>
      <div class="nav-section">Communication</div>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/events.html">Events</a>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/notifications.html">Notifications <span class="notif-badge" id="notif-badge" style="display:none">0</span></a>
      <div class="nav-section">Settings</div>
      <a class="nav-item" href="/Library_Management_System/frontend/admin/profile.html">Profile</a>
    </nav>
    <div class="sidebar-footer"><div class="nav-item" onclick="logout()">Logout</div></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="topbar-left"><span class="topbar-title">All Students</span></div></header>
    <main class="content">
      <div class="card">
        <div class="card-header">Registered Students
          <div class="search-wrap"><span class="search-icon">&#128269;</span><input type="text" id="search" placeholder="Search..." oninput="filterStudents()"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Member ID</th><th>Email</th><th>Phone</th><th>Joined</th><th>Action</th></tr></thead>
            <tbody id="students-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/Library_Management_System/frontend/js/script.js"></script>
<script>
  if (!requireAuth('admin')) throw '';
  let allStudents = [];
  async function load() {
    const r = await apiFetch('/auth/students');
    const tbody = document.getElementById('students-tbody');
    if (!r?.ok) { tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:24px">Error loading</td></tr>'; return; }
    allStudents = r.data;
    render(allStudents);
  }
  function render(data) {
    const tbody = document.getElementById('students-tbody');
    if (!data.length) { tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><p>No students found</p></div></td></tr>'; return; }
    tbody.innerHTML = data.map(s => `
      <tr>
        <td><strong>${s.name}</strong></td>
        <td><span class="badge badge-info">${s.member_id||'—'}</span></td>
        <td>${s.email}</td>
        <td>${s.phone||'—'}</td>
        <td>${formatDate(s.created_at)}</td>
        <td><button class="btn btn-outline btn-sm" onclick="sendMsg(${s.id},'${s.name}')">Send Notification</button></td>
      </tr>`).join('');
  }
  function filterStudents() {
    const q = document.getElementById('search').value.toLowerCase();
    render(allStudents.filter(s => s.name.toLowerCase().includes(q) || s.email.toLowerCase().includes(q) || (s.member_id||'').toLowerCase().includes(q)));
  }
  async function sendMsg(uid, name) {
    const msg = prompt(`Send notification to ${name}:`);
    if (!msg) return;
    const r = await apiFetch('/notifications/send', { method:'POST', body:JSON.stringify({user_id:uid,title:'Message from Library',message:msg,type:'info'}) });
    if (r?.ok) showToast('Notification sent!','success');
    else showToast('Error sending','error');
  }
  load();
</script>
</body>
</html>
