      <a class="nav-item" href="/admin/return.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" class="nav-icon"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> Return Book</a>
      <a class="nav-item" href="/admin/overdue.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" class="nav-icon"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Overdue</a>
      <div class="nav-section">Students</div>

    <div class="sidebar-footer"><div class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" class="nav-icon"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</div></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="topbar-left"><span class="topbar-title">Issue Book</span></div></header>
    <main class="content">
      <div style="max-width:600px">
        <div class="card">
          <div class="card-header">Issue a Book to Student</div>
          <div class="card-body">
            <div class="form-group">
              <label>Select Student</label>
              <select id="f-student"><option value="">-- Select student --</option></select>
            </div>
            <div class="form-group">
              <label>Select Book</label>
              <select id="f-book"><option value="">-- Select book --</option></select>
            </div>
            <div class="form-group">
              <label>Loan Duration (days)</label>
              <select id="f-days">
                <option value="7">7 days</option>
                <option value="14" selected>14 days</option>
                <option value="21">21 days</option>
                <option value="30">30 days</option>
              </select>
            </div>
            <button class="btn btn-primary btn-block" onclick="issueBook()">Issue Book</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/js/script.js"></script>
<script>
  if (!requireAuth('admin')) throw '';
  async function init() {
    const [sr, br] = await Promise.all([apiFetch('/auth/students'), apiFetch('/books/')]);
    if (sr?.ok) {
      const sel = document.getElementById('f-student');
      sr.data.forEach(s => sel.innerHTML += `<option value="${s.id}">${s.name} (${s.member_id})</option>`);
    }
    if (br?.ok) {
      const sel = document.getElementById('f-book');
      br.data.filter(b => b.available > 0).forEach(b => sel.innerHTML += `<option value="${b.id}">${b.title} — ${b.author} (${b.available} left)</option>`);
    }
  }
  async function issueBook() {
    const user_id = document.getElementById('f-student').value;
    const book_id = document.getElementById('f-book').value;
    const days    = document.getElementById('f-days').value;
    if (!user_id || !book_id) { showToast('Select student and book','warning'); return; }
    const r = await apiFetch('/issued/issue', { method:'POST', body:JSON.stringify({user_id,book_id,days}) });
    if (r?.ok) { showToast(`Book issued! Due: ${formatDate(r.data.due_date)}`,'success'); init(); }
    else showToast(r?.data?.error||'Error issuing book','error');
  }
  init();
</script>
</body>
</html>
